name: Nightly

# Build the current main branch and publish the APK as a workflow artifact.
on:
  schedule:
    # 18:00 UTC = 02:00 Asia/Shanghai.
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        # Only platform-tools: the action's default list names the removed "tools" package, which
        # the runner's sdkmanager 16.0 refuses - see ci.yml.
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      # tools/zopfli-apk.py re-deflates the APK after Gradle - see that file.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Zopfli
        run: python -m pip install zopfli

      # Without the secrets the build still succeeds, but it is signed with the throwaway debug
      # key. The artifact remains usable for testing, but will not install over a properly signed
      # release.
      - name: Restore the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "SIGNING_STORE_FILE=release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set; falling back to the debug key."
            mkdir -p "$HOME/.android"
            if [ ! -f "$HOME/.android/debug.keystore" ]; then
              keytool -genkeypair -noprompt \
                -keystore "$HOME/.android/debug.keystore" \
                -storetype JKS \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US" \
                -keyalg RSA -keysize 2048 -validity 10000
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build artifacts
        id: build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          date_tag=$(date -u +'%Y%m%d')
          short_sha=$(git rev-parse --short HEAD)
          echo "date_tag=$date_tag" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD 2>/dev/null || true)
          base="0.0.0"
          if [ -n "$last" ]; then
            base="${last#v}"
            since=$(git rev-list --count "$last..HEAD")
          else
            since=$(git rev-list --count HEAD)
          fi
          major="${base%%.*}"
          rest="${base#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          if [ "$since" -gt 998 ]; then since=998; fi
          code=$(( (major * 10000 + minor * 100 + patch) * 1000 + since + 1 ))
          echo "after ${last:-no release}: $since commits, versionCode $code"
          ./gradlew --no-daemon assembleRelease assembleDebug \
            "-PmcVersionName=${base}" \
            "-PmcVersionSuffix=-nightly.${date_tag}.${short_sha}" \
            "-PmcVersionCode=${code}"
          python tools/zopfli-apk.py app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/HyperMusicCover-nightly-${date_tag}-${short_sha}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/HyperMusicCover-nightly-${date_tag}-${short_sha}-debug.apk"
          (
            cd dist
            zip -9 "HyperMusicCover-nightly-${date_tag}-${short_sha}-release.zip" \
              "HyperMusicCover-nightly-${date_tag}-${short_sha}.apk"
            zip -9 "HyperMusicCover-nightly-${date_tag}-${short_sha}-debug.zip" \
              "HyperMusicCover-nightly-${date_tag}-${short_sha}-debug.apk"
          )

      - name: Create build notes
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          {
            echo "Nightly artifact built from ${GITHUB_SHA}."
            echo
            if [ "$SIGNED" != "true" ]; then
              echo "> **Warning:** Built with the debug key; it will not install over a properly signed release."
              echo
            fi
            echo "### Changes"
            echo
            git log --no-merges --pretty='- %s (%h)' -n 20 "${GITHUB_SHA}"
          } > dist/BUILD_NOTES.md

      - name: Upload nightly artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperMusicCover-nightly-${{ steps.build.outputs.date_tag }}-${{ steps.build.outputs.short_sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
