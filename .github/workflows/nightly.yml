name: Nightly

# One pre-release a night, from whatever is on main. It skips itself when nothing has been
# pushed since the last one, so the release list stays a list of actual changes rather than a
# calendar.
on:
  schedule:
    # 18:00 UTC = 02:00 Asia/Shanghai. GitHub runs scheduled jobs late under load, which is
    # why "has anything changed" is decided by commit sha and not by the clock.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if nothing changed since the last nightly'
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  nightly:
    # Forks inherit the schedule but must not publish releases of their own.
    if: github.repository == 'zyl6932/HyperMusicCover'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      published: ${{ steps.check.outputs.publish }}
      tag: nightly-${{ steps.build.outputs.date_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether there is anything to publish
        id: check
        run: |
          set -euo pipefail
          previous_tag=$(gh release list --limit 50 --json tagName \
            --jq '[.[] | select(.tagName | startswith("nightly-"))][0].tagName // ""')
          previous_sha=""
          if [ -n "$previous_tag" ]; then
            previous_sha=$(gh api "repos/${{ github.repository }}/git/refs/tags/$previous_tag" \
              --jq '.object.sha' 2>/dev/null || echo "")
          fi
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "previous_sha=$previous_sha" >> "$GITHUB_OUTPUT"
          if [ "$previous_sha" = "$GITHUB_SHA" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "Nothing new since $previous_tag ($previous_sha)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        if: steps.check.outputs.publish == 'true'
        # Only platform-tools: the action's default list names the removed "tools" package, which
        # the runner's sdkmanager 16.0 refuses - see ci.yml.
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.publish == 'true'

      # tools/zopfli-apk.py re-deflates the APK after Gradle - see that file.
      - uses: actions/setup-python@v5
        if: steps.check.outputs.publish == 'true'
        with:
          python-version: '3.12'

      - name: Install Zopfli
        if: steps.check.outputs.publish == 'true'
        run: python -m pip install zopfli

      # Without the secrets the build still succeeds, but it is signed with the throwaway debug
      # key - a different signature, which Android refuses to install over a properly signed
      # build. The release notes say so rather than letting someone find out on their phone.
      - name: Restore the signing key
        if: steps.check.outputs.publish == 'true'
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set; falling back to the debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release
        if: steps.check.outputs.publish == 'true'
        id: build
        env:
          SIGNING_STORE_FILE: ${{ steps.signing.outputs.signed == 'true' && 'release.jks' || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          date_tag=$(date -u +'%Y%m%d')
          short_sha=$(git rev-parse --short HEAD)
          echo "date_tag=$date_tag" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          # Numbered after the stable release it follows, so it installs over that release and
          # the next one installs over it. release.yml gives vX.Y.Z the code
          # (X*10000 + Y*100 + Z) * 1000; a nightly takes that and adds one more than the
          # number of commits since the tag - 708001 and up after 0.7.8, all under 0.7.9's
          # 709000, and rising along main from one nightly to the next. Its name carries the
          # same version, which is what the app's updater compares: a nightly after 0.7.8 is
          # offered 0.7.9, not 0.7.8 again.
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD 2>/dev/null || true)
          base="0.0.0"
          if [ -n "$last" ]; then
            base="${last#v}"
            since=$(git rev-list --count "$last..HEAD")
          else
            since=$(git rev-list --count HEAD)
          fi
          major="${base%%.*}"
          rest="${base#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          if [ "$since" -gt 998 ]; then since=998; fi
          code=$(( (major * 10000 + minor * 100 + patch) * 1000 + since + 1 ))
          echo "after ${last:-no release}: $since commits, versionCode $code"
          ./gradlew --no-daemon assembleRelease \
            "-PmcVersionName=${base}" \
            "-PmcVersionSuffix=-nightly.${date_tag}.${short_sha}" \
            "-PmcVersionCode=${code}"
          python tools/zopfli-apk.py app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/HyperMusicCover-nightly-${date_tag}-${short_sha}.apk"

      - name: Publish the pre-release
        if: steps.check.outputs.publish == 'true'
        env:
          TAG: nightly-${{ steps.build.outputs.date_tag }}
          PREVIOUS_SHA: ${{ steps.check.outputs.previous_sha }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          {
            echo "Automatic nightly build of \`main\` at ${GITHUB_SHA}."
            echo
            if [ "$SIGNED" != "true" ]; then
              echo "> **Warning**"
              echo "> Built with the debug key - it will not install over a properly signed"
              echo "> release. Set the SIGNING_* repository secrets to fix this."
              echo
            fi
            echo "### Changes"
            echo
            if [ -n "$PREVIOUS_SHA" ] && git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null; then
              git log --no-merges --pretty='- %s (%h)' "${PREVIOUS_SHA}..${GITHUB_SHA}"
            else
              git log --no-merges --pretty='- %s (%h)' -n 20 "${GITHUB_SHA}"
            fi
          } > notes.md
          # A tag may already exist if the day's build is re-run; replace it rather than fail.
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" dist/*.apk \
            --prerelease \
            --title "Nightly ${{ steps.build.outputs.date_tag }}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"

      # Keeps the release page readable. Stable releases are never touched: only tags that
      # start with nightly- are considered.
      - name: Prune old nightlies
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("nightly-"))]
                  | sort_by(.createdAt) | reverse | .[7:] | .[].tagName' \
          | while read -r old; do
              [ -n "$old" ] || continue
              echo "Deleting $old"
              gh release delete "$old" --cleanup-tag --yes
            done

  # Into the Telegram group too, the same push a stable release gets - unpinned, so the pinned
  # message stays the stable one (telegram.yml pins only what is not a pre-release). Called
  # rather than left to the release event: a release made with github.token raises none.
  telegram:
    needs: nightly
    if: needs.nightly.outputs.published == 'true'
    uses: ./.github/workflows/telegram.yml
    with:
      tag: ${{ needs.nightly.outputs.tag }}
    secrets: inherit
